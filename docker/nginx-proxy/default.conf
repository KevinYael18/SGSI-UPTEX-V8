server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # No revelar la versión de nginx (CIS nginx 2.5.x).
    server_tokens off;

    # Cabeceras de seguridad: se definen UNA sola vez aquí (las de Apache se
    # ocultan para no duplicarlas).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-Powered-By;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # El filtro XSS heredado de los navegadores está retirado y podía usarse
    # para filtrar información: se desactiva explícitamente (recomendación OWASP).
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS: los navegadores lo ignoran por HTTP y lo aplican en cuanto el sitio
    # se sirve por HTTPS. Sin includeSubDomains para no afectar otros
    # subdominios institucionales.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Content-Security-Policy construida a partir de lo que la SPA usa realmente:
    #  - script: solo propios + el hash del script en línea de index.html
    #    (tema claro/oscuro). Si se modifica ese script, recalcular el hash.
    #  - style: propios + Google Fonts; los atributos style que fija Vue en
    #    tiempo de ejecución requieren style-src-attr 'unsafe-inline'.
    #  - frame/media/img: visor de evidencias (PDF/video), vista previa de foto.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Nk5aL+NHfYSQJfETmEzCvAmWJrRGa7QkoHSgu32phns='; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 512;

    # DNS interno de Docker: el nombre «app» se vuelve a resolver cada 10 s.
    # Sin esto nginx guardaba la IP del contenedor al arrancar y, tras
    # reconstruir la app (docker compose up -d --build), respondía 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sgsi_app http://app:80;

    # Documentación Swagger/OpenAPI: no se publica (revela todos los endpoints y
    # parámetros). Para consultarla en desarrollo: php artisan l5-swagger:generate
    # y abrir storage/api-docs/api-docs.json, o comentar este bloque localmente.
    location ~ ^/(api/documentation|api/oauth2-callback|docs)(/|$) {
        return 404;
    }

    # SGSI Intelligence Assistant: la lectura de un PDF y su análisis pueden
    # tardar más que una petición normal (el backend acota cada llamada al
    # proveedor; ver GEMINI_PRESUPUESTO_SEGUNDOS).
    location ^~ /api/v1/ia/ {
        proxy_pass $sgsi_app;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass $sgsi_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
}