; Overrides de producción para SGSI UPTex (php.ini-production como base implícita)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log

upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 60
memory_limit = 256M

; OPcache: rendimiento en producción (código no cambia entre requests)
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 192

session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
; cookie_secure=0 porque el entorno de referencia es HTTP (demo/defensa de
; tesis) — cambiar a 1 en cuanto se sirva detrás de HTTPS real.

date.timezone = America/Mexico_City