[supervisord]
nodaemon=true
user=root
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

; --- Proceso 1: Apache (sirve la API + el SPA compilado) ---
[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/www/html/storage/logs/apache-stdout.log
stderr_logfile=/var/www/html/storage/logs/apache-stderr.log

; --- Proceso 2: Queue worker (driver 'database', sin Redis) ---
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
priority=20
user=www-data
stopwaitsecs=10
stdout_logfile=/var/www/html/storage/logs/queue-stdout.log
stderr_logfile=/var/www/html/storage/logs/queue-stderr.log

; --- Proceso 3: Scheduler (dispara NotificarAccionesVencidasJob, etc.) ---
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
priority=30
user=www-data
stdout_logfile=/var/www/html/storage/logs/scheduler-stdout.log
stderr_logfile=/var/www/html/storage/logs/scheduler-stderr.log