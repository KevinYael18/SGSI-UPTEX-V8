# Configuración de seguridad recomendada para producción (Apache 2.4).
# Complementa, no reemplaza, las cabeceras que ya pone Laravel.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # HSTS solo tiene sentido detrás de HTTPS real (terminado en el propio
    # Apache con certificado, o en un balanceador delante) — se deja
    # comentado a propósito para no romper un despliegue HTTP-only de demo:
    # Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
</IfModule>

# Deshabilita el listado de directorios en todo el árbol, no solo en public/
<Directory />
    Options -Indexes
    AllowOverride None
    Require all denied
</Directory>