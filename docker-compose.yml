name: sgsi-uptex

services:
  proxy:
    image: nginx:alpine
    container_name: sgsi-uptex-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sgsi_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgsi-uptex-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"
    environment:
      APP_NAME: "${APP_NAME:-SGSI UPTex}"
      TZ: "America/Mexico_City"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-null}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-sgsi_uptex}"
      DB_USERNAME: "${DB_USERNAME:-sgsi_app}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-SGSI UPTex}"
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs_data:/var/www/html/storage/logs
    networks:
      - sgsi_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.0
    container_name: sgsi-uptex-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-sgsi_uptex}"
      MYSQL_USER: "${DB_USERNAME:-sgsi_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      TZ: "America/Mexico_City"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sgsi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    

networks:
  sgsi_network:
    driver: bridge

volumes:
  mysql_data:
  storage_data:
  logs_data: